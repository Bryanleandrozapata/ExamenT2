<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Ejemplos Prof. Ernesto Arbulú</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>
</head>

<body>
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">

                <h1 class="card-title text-center"
                    th:text="|Orden de compra Edición - Nro. ${orden.nroOrden}|">
                </h1>

                <div class="row d-flex justify-content-center">
                    <div class="col-md-6">

                        <form th:action="@{/orden-compra/actualizar}"
                              class="row g-2"
                              method="post"
                              novalidate
                              th:object="${orden}">

                            <input type="hidden" th:field="*{nroOrden}" />

                            <div class="col-md-12 position-relative">
                                <label for="proveedor" class="form-label">
                                    Proveedor
                                </label>

                                <select class="form-select"
                                        id="proveedor"
                                        name="idProveedor"
                                        required>
                                    <option value="" hidden>--Seleccione--</option>

                                    <option th:each="item : ${lstProveedores}"
                                            th:text="${item.ruc + ' - ' + item.razonSocial}"
                                            th:value="${item.idProveedor}"
                                            th:selected="${orden.proveedor != null and item.idProveedor == orden.proveedor.idProveedor}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6 position-relative">
                                <label for="monto" class="form-label">
                                    Monto
                                </label>

                                <input type="number"
                                       class="form-control"
                                       step="0.01"
                                       min="0.01"
                                       placeholder="0.00"
                                       th:field="*{monto}"
                                       required>
                            </div>

                            <div class="col-md-12 position-relative">
                                <label for="direccionEntrega" class="form-label">
                                    Dirección de entrega
                                </label>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Ingrese una dirección de entrega"
                                       maxlength="255"
                                       th:field="*{direccionEntrega}"
                                       required>
                            </div>

                            <div class="col-md-6 position-relative">
                                <label for="fechaEntrega" class="form-label">
                                    Fecha de entrega
                                </label>

                                <input type="date"
                                       class="form-control"
                                       th:field="*{fechaEntrega}"
                                       required>
                            </div>

                            <div class="col-md-6 position-relative">
                                <label for="estado" class="form-label">
                                    Estado
                                </label>

                                <select class="form-select"
                                        th:field="*{estado}"
                                        required>
                                    <option value="P">Pendiente</option>
                                    <option value="C">Completado</option>
                                    <option value="A">Anulado</option>
                                </select>
                            </div>

                            <div class="col-md-12 d-flex justify-content-between mt-4">
                                <a th:href="@{/orden-compra/listado}"
                                   class="btn btn-outline-dark">
                                    <i class="fa-solid fa-reply"></i>
                                    Regresar
                                </a>

                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                    Guardar
                                </button>

                                <button type="reset" class="btn btn-secondary">
                                    <i class="fa-solid fa-broom"></i>
                                    Limpiar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="text/javascript">
        $(document).ready(function () {
            $("form").validate({
                rules: {},
                messages: {},
                errorElement: 'div',
                errorClass: 'invalid-tooltip',
                highlight: function (element) {
                    $(element).addClass('is-invalid')
                        .removeClass('is-valid');
                },
                unhighlight: function (element) {
                    $(element).removeClass('is-invalid')
                        .addClass('is-valid');
                }
            });
        });
    </script>
</body>

</html>
